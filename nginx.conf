# =============================================================
# Nginx Reverse Proxy Config for Naija Sabi Chat API
# VPS / cPanel with Nginx (not Apache)
# Place at: /etc/nginx/sites-available/naijagbts.com
# Then: ln -s /etc/nginx/sites-available/naijagbts.com /etc/nginx/sites-enabled/
# =============================================================

# Rate limiting zones — defined at http level
limit_req_zone $binary_remote_addr zone=api:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=chat:10m rate=5r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream — Node.js cluster (PM2 handles multiple workers on one port)
upstream naija_api {
    server 127.0.0.1:5000;
    keepalive 32;           # Keep 32 persistent connections to Node.js
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

# ---------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name naijagbts.com www.naijagbts.com api.naijagbts.com;

    # LetsEncrypt challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------
# HTTPS — API Subdomain
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api.naijagbts.com;

    # ---- SSL (Let's Encrypt via Certbot) ----
    ssl_certificate     /etc/letsencrypt/live/naijagbts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijagbts.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/naijagbts.com/chain.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ---- Security Headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss;

    # ---- Connection limits ----
    limit_conn addr 20;

    # ---- Client limits ----
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ---- Buffers (tuned for API JSON responses) ----
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;

    # ---- Auth endpoints — strict rate limiting ----
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://naija_api;
        include /etc/nginx/proxy_params;
    }

    # ---- Chat endpoint — medium rate limiting ----
    location /api/chat/ {
        limit_req zone=chat burst=10 nodelay;
        limit_req_status 429;

        # Long timeout for AI streaming responses
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        proxy_pass http://naija_api;
        include /etc/nginx/proxy_params;
    }

    # ---- Health check — no rate limit, no logging ----
    location /health {
        access_log off;
        proxy_pass http://naija_api;
        proxy_read_timeout 5s;
        include /etc/nginx/proxy_params;
    }

    # ---- All other API endpoints ----
    location / {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://naija_api;
        include /etc/nginx/proxy_params;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
